apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/devopssourabhbiswas/solar-system-devops-project-gitops-repo.git  # your GitOps repo
    targetRevision: main  #your default branch
    path: gitops-repo/argocd-apps
    directory:                   # tells it to look at gitops-repo/argocd-apps directory
      recurse: true
      exclude: '00-bootstrap/**'  # exclude the bootstrap app itself to avoid duplicate apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:               # makes Argo continuously apply changes
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m